<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatade Kitchen</title>
<meta name="theme-color" content="#1f6f4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#fbf7f0; --card:#ffffff; --ink:#1d2420; --muted:#66706a; --line:#e6dfd2;
  --green:#1f6f4a; --green-soft:#e3f1e8; --orange:#d9622b; --orange-soft:#fbe7dc;
  --blue:#2d5f9a; --blue-soft:#e2ebf7; --red:#b33a3a; --red-soft:#f7e1e1;
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141815;--card:#1d231f;--ink:#eef2ee;--muted:#9aa59e;--line:#2c352f;
    --green:#5cc08c;--green-soft:#1f3a2b;--orange:#f08a55;--orange-soft:#3d2619;
    --blue:#7fa9e0;--blue-soft:#1c2a3d;--red:#e07a7a;--red-soft:#3d1f1f;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:var(--green);color:#fff}
header h1{margin:0;font-size:26px;letter-spacing:.3px}
header .date{margin-left:auto;font-size:18px;opacity:.9;text-align:right}
nav{display:flex;gap:8px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:transparent;padding:12px 20px;border-radius:999px;font-size:19px;font-weight:600;white-space:nowrap;color:var(--muted)}
nav button.on{background:var(--green-soft);color:var(--green)}
main{padding:20px 24px 80px;max-width:1400px;margin:0 auto}
h2{font-size:24px;margin:8px 0 14px}
h3{font-size:19px;margin:0 0 6px}
.muted{color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.slot{display:flex;flex-direction:column;gap:6px;min-height:120px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:14px 16px}
.slot:active{transform:scale(.99)}
.slot .who{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.slot .meal{font-size:21px;font-weight:600;display:flex;gap:10px;align-items:center}
.slot .meal .em{font-size:32px}
.slot.empty .meal{color:var(--muted);font-weight:500}
.who-kids{color:var(--orange)} .who-wife{color:var(--blue)} .who-me{color:var(--green)} .who-family{color:var(--ink)}
.tip{font-size:15px;background:var(--green-soft);color:var(--ink);border-radius:12px;padding:8px 10px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;margin-right:4px}
.p-d{background:var(--green-soft);color:var(--green)} .p-k{background:var(--orange-soft);color:var(--orange)}
.p-p{background:var(--blue-soft);color:var(--blue)} .p-x{background:var(--red-soft);color:var(--red)}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:18px;background:var(--green);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--red-soft);color:var(--red)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.banner{display:flex;gap:14px;align-items:flex-start;background:var(--green-soft);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px}
.banner .big{font-size:34px}
/* week */
.week{display:grid;grid-template-columns:170px repeat(7,minmax(130px,1fr));gap:6px;overflow-x:auto}
.week .hd{font-weight:700;text-align:center;padding:8px 4px;border-radius:12px}
.week .hd.today{background:var(--green);color:#fff}
.week .lab{font-size:14px;font-weight:700;padding:8px 6px;display:flex;align-items:center}
.week .cell{min-height:78px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 8px;font-size:15px;text-align:left;display:flex;flex-direction:column;gap:2px}
.week .cell .em{font-size:22px}
.week .cell.na{background:transparent;border-style:dashed;opacity:.4;cursor:default}
.week .cell.skip{color:var(--muted);font-style:italic}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:min(1100px,100%);max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 24px 32px}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:12px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px}
.choice .em{font-size:34px;line-height:1}
.choice.cur{outline:3px solid var(--green)}
.choice small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
/* shopping */
.shop label{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:19px}
.shop input{width:28px;height:28px;accent-color:var(--green)}
.shop label.got span{text-decoration:line-through;color:var(--muted)}
input[type=text],input[type=email],input[type=password],textarea{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.form{display:grid;gap:12px;max-width:720px}
.updatebar{display:none;align-items:center;gap:16px;padding:12px 24px;background:var(--green-soft);font-weight:600;font-size:19px}
.updatebar.on{display:flex}
.yo{display:block;font-size:.78em;font-weight:500;font-style:italic;color:var(--muted)}
.yo-h{font-size:.7em;font-weight:500;font-style:italic;color:var(--muted);margin-left:6px}
.yo-w{text-transform:none;letter-spacing:0;font-weight:600;font-style:italic;opacity:.8}
nav small{font-weight:500;font-style:italic;opacity:.75;margin-left:2px}
.rlink{color:var(--blue);font-weight:700;text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--blue-soft)}
.shop a.buy{font-size:15px;font-weight:700;text-decoration:none;color:var(--blue);white-space:nowrap}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:44px;flex:none}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,98,43,.55)}100%{box-shadow:0 0 0 26px rgba(217,98,43,0)}}
.voice{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.voice .said{font-size:17px;color:var(--muted);min-height:24px}
.voice .reply{font-size:21px;font-weight:600}
.updatebar .btn{margin-left:auto}
@media (max-width:640px){
  header{padding:12px 16px} header h1{font-size:21px}
  nav,main{padding-left:16px;padding-right:16px}
  .week{grid-template-columns:110px repeat(7,120px)}
}
</style>
<link rel="stylesheet" href="family.css">
</head>

const yoName = m => m && (m.yo || YO_NAMES[m.id]);
function greeting(){ const h = new Date().getHours(); return h<12 ? 'Ẹ káàárọ̀' : h<16 ? 'Ẹ káàsán' : h<21 ? 'Ẹ kúrọ̀lẹ́' : 'Ó dàárọ̀'; }

/* ---------- Storage ---------- */
const KEY = 'fatadeKitchen.v1';
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
let db = Object.assign({names:{me:'Daddy',wife:'Mummy',kids:'Kids'}, home:{kids:4, zip:'', stores:["Whole Foods","Seabra's","Super Fresh"]}, plans:{}, custom:[], got:{}, extras:{}}, load());
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
// Saved settings from older versions lack newer fields
db.home = Object.assign({kids:4, zip:'', stores:["Whole Foods","Seabra's","Super Fresh"]}, db.home);
db.extras ||= {};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allMeals = () => BASE_MEALS.concat(YORUBA_MEALS, WEB_MEALS, db.custom);
const mealById = id => allMeals().find(m => m.id === id);
const recipeOf = m => m.recipe || RECIPES[m.id];
const money = n => '$' + n.toFixed(2);

/* ---------- Costs ---------- */
// PRICES[].use is the share of a pack one family-of-6 meal uses; scale by who's eating.
function servingsFor(slot){ return slot.who==='kids' ? db.home.kids : slot.who==='family' ? db.home.kids+2 : 1; }
function mealCost(m, servings){
  return m.ing.reduce((t,g)=> PRICES[g] ? t + PRICES[g].price*PRICES[g].use*servings/6 : t, 0);
}
function storeLink(g){
  const p = PRICES[g];
  if(p && p.store==='african') return db.home.zip
    ? `https://www.google.com/maps/search/${encodeURIComponent('African grocery store near '+db.home.zip)}`
    : AFRICAN_STORES[0].url;
  return `https://www.wholefoodsmarket.com/search?text=${encodeURIComponent(g.replace(/\(.*?\)/g,'').split('/')[0].trim())}`;
}
// The family's usual supermarkets (editable in Settings); opens each store's locations near the ZIP
function storeMap(name){
  return `https://www.google.com/maps/search/${encodeURIComponent(name + (db.home.zip ? ' near '+db.home.zip : ''))}`;
}
let weekOffset = 0;

function mondayOf(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function weekKey(off=weekOffset){ const m = mondayOf(new Date()); m.setDate(m.getDate()+off*7);
  return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(m.getDate()).padStart(2,'0')}`; }
function weekDates(off=weekOffset){ const m = mondayOf(new Date()); m.setDate(m.getDate()+off*7);
  return DAYS.map((_,i)=>{ const d=new Date(m); d.setDate(m.getDate()+i); return d; }); }
function todayIdx(){ return (new Date().getDay()+6)%7; }
function plan(wk=weekKey()){ return db.plans[wk] ||= {}; }
function slotsFor(dayIdx){ const we = dayIdx>=5; return SLOTS.filter(s=>!(we && s.weekdayOnly)); }
function getPick(wk, day, slot){ return (db.plans[wk]||{})[day]?.[slot]; }
function setPick(wk, day, slot, val){
  const p = plan(wk); p[day] ||= {};
  if(val==null) delete p[day][slot]; else p[day][slot] = val;
  save();
}
function candidates(slot, showAll){
  return allMeals().filter(m => m.cats.some(c=>slot.cats.includes(c)) && (showAll || !slot.d || m.d));
}
function fmtDate(d){ return d.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'}); }

function slotCard(wk, day, slot){

  const warn = m && slot.who==='family' && !m.d ? `<div><span class="pill p-x">${esc(db.names.me)}: use the swap tip</span></div>` : '';
  const meta = m ? `<span class="row muted" style="font-size:15px">≈ ${money(mealCost(m, servingsFor(slot)))}
    ${recipeOf(m) ? `<a class="rlink" href="${recipeOf(m)}" target="_blank" rel="noopener">📖 Recipe</a>` : ''}</span>` : '';
  return `<button class="slot ${m?'':'empty'}" data-day="${day}" data-slot="${slot.id}">

}

function autofill(wk, days){
  const used = {}; // slotId -> Set of meal ids used this week (avoid repeats)
  for(let i=0;i<7;i++) for(const s of SLOTS){ const p=getPick(wk,i,s.id); if(p) (used[s.id] ||= new Set()).add(p); }
  for(const d of days){
    for(const s of slotsFor(d)){
      if(getPick(wk,d,s.id)) continue;
      let pool = candidates(s,false);
      if(s.who==='kids') pool = pool.filter(m=>m.k);
      if(s.id==='meLate'){ // if dinner is a soup, the "soup only" bowl is easiest
        const dn = mealById(getPick(wk,d,'dinner')||''); if(dn && /swallow|starch/i.test(dn.name) && Math.random()<.5){ setPick(wk,d,s.id,'soup-only'); continue; }
      }
      let fresh = pool.filter(m=>!(used[s.id]||new Set()).has(m.id) && m.id!=='soup-only');
      if(!fresh.length) fresh = pool;
      // Yoruba home cooking first: 70% of the time choose from Yoruba dishes when any fit
      const yor = fresh.filter(m=>YORUBA_IDS.has(m.id));
      if(yor.length && Math.random()<.7) fresh = yor;
      const choice = fresh[Math.floor(Math.random()*fresh.length)];
      if(choice){ setPick(wk,d,s.id,choice.id); (used[s.id] ||= new Set()).add(choice.id); }
    }
  }
}

/* ---------- Shopping ---------- */
// Shopping follows the week shown in "This week" (so Sunday-night planning for next week works).
const shopWeek = () => weekKey();
const extras = wk => db.extras[wk] ||= [];
function weekNeeds(wk){
  const need = {};
  for(let i=0;i<7;i++) for(const s of slotsFor(i)){
    const m = mealById(getPick(wk,i,s.id)||''); if(!m) continue;
    for(const g of m.ing) need[g] = (need[g]||0) + (PRICES[g] ? PRICES[g].use*servingsFor(s)/6 : 0);
  }
  return Object.entries(need).map(([g,n])=>{
    const p = PRICES[g], packs = p ? Math.max(1, Math.ceil(n - 0.1)) : 0;
    return {g, p, packs, cost: p ? packs*p.price : 0};
  }).sort((a,b)=>a.g.localeCompare(b.g));
}
function shopRow(it, got){
  const {g,p,packs,cost} = it;
  return `<label class="${got[g]?'got':''}"><input type="checkbox" data-g="${esc(g)}" ${got[g]?'checked':''}>

    ${p?`<b>${money(cost)}</b>`:''}
    <a class="buy" href="${storeLink(g)}" target="_blank" rel="noopener">${p&&p.store==='african'?'🌍 Find':'🔎 Whole Foods'}</a></label>`;
}

        ${AFRICAN_STORES.map(s=>`<div style="padding:8px 0"><a class="rlink" href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a> <span class="muted">${esc(s.note)}</span></div>`).join('')}</div>`

/* ---------- Voice assistant ---------- */
// Uses the browser's built-in speech recognition (Chrome on Android) and speech synthesis.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// Inside the installed Android app the browser speech APIs don't exist; the app provides its own (family.js NATIVE)
const canVoice = NATIVE ? NATIVE.voiceAvailable() : !!SR;
// English voices can't read tone marks, so spell the Yoruba phrases out phonetically
const sayable = t => t.replace(/Ó dáa/g,'Oh dah').replace(/Ẹ nlẹ́/g,'Eh nleh');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function splitItems(t){
  return t.replace(/\b(to|on|onto)\s+(the|my|our)?\s*(shopping\s+)?list\b/gi,'').replace(/\bplease\b/gi,'')
    .split(/,|\band\b|&|\balso\b/i).map(s=>s.trim().replace(/^(some|a|an)\s+/i,'').replace(/[.?!]+$/,'')).filter(s=>s.length>1).map(cap);
}
function addItems(names){
  const ex = extras(shopWeek()), added = [];
  for(const n of names) if(!ex.some(x=>x.name.toLowerCase()===n.toLowerCase())){ ex.push({name:n, got:false}); added.push(n); }
  save(); return added;
}
function findItem(name){
  const q = name.toLowerCase().replace(/^(the|some)\s+/,''), wk = shopWeek();
  const x = extras(wk).find(x=>x.name.toLowerCase().includes(q) || q.includes(x.name.toLowerCase()));
  if(x) return {type:'extra', x};
  const it = weekNeeds(wk).find(i=>i.g.toLowerCase().includes(q));
  return it ? {type:'planned', g:it.g} : null;
}
const listText = (arr) => arr.length<2 ? arr.join('') : arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];

/* ---------- Send list to phone ----------
   Uses ntfy.sh (free push notifications): the tablet posts to a private random
   topic; the phone's ntfy app subscribes to it. The topic name is the password,
   so it lives only in this tablet's saved settings. */
function ntfyTopic(){
  if(!db.home.ntfy){
    const a = 'abcdefghijkmnpqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint8Array(14));
    db.home.ntfy = 'fatade-' + [...r].map(b=>a[b % a.length]).join(''); save();
  }
  return db.home.ntfy;
}
function shoppingMessage(){
  const wk = shopWeek(), got = db.got[wk]||{}, items = weekNeeds(wk).filter(i=>!got[i.g]);
  const ex = extras(wk).filter(x=>!x.got).map(x=>x.name);
  const line = i => `☐ ${i.g}${i.p?` — ${i.packs} × ${i.p.pack} (~${money(i.cost)})`:''}`;
  const sm = items.filter(i=>!i.p || i.p.store!=='african'), af = items.filter(i=>i.p && i.p.store==='african');
  const parts = [];
  if(ex.length) parts.push(`ADDED BY ${db.names.wife.toUpperCase()}\n` + ex.map(n=>'☐ '+n).join('\n'));
  if(sm.length) parts.push(`SUPERMARKET (${db.home.stores.join(' / ')})\n` + sm.map(line).join('\n'));
  if(af.length) parts.push(`AFRICAN GROCER\n` + af.map(line).join('\n'));
  if(!parts.length) return '';
  const total = items.reduce((t,i)=>t+i.cost,0);
  let msg = parts.join('\n\n') + (total ? `\n\nEstimated total ~${money(total)}` : '');
  if(new Blob([msg]).size > 3900) msg = msg.slice(0, 3800) + '\n… (open the tablet for the rest)';
  return msg;
}
async function sendList(){
  const msg = shoppingMessage();
  if(!msg) return 'The shopping list is empty, so there was nothing to send.';
  try{
    const r = await fetch('https://ntfy.sh/', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({topic: ntfyTopic(), title: '🛒 Fatade shopping list · Ọjà', message: msg, tags:['shopping_cart'], priority: 4})});
    if(!r.ok) throw new Error(r.status);
    return 'Ó dáa! The shopping list is on its way to your phone.';
  }catch(e){
    return navigator.onLine === false ? 'The tablet is offline. Connect to Wi-Fi and say send again.'
      : 'Sorry, I couldn\'t send the list just now. Please try again in a minute.';
  }
}
function toast(text){
  let t = $('#toast'); if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = text; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 5000);
}
function handleCommand(raw){
  const t = raw.trim().toLowerCase().replace(/[.?!]+$/,''), wk = shopWeek();
  if(/^(no|nope|that'?s (all|it)|done|nothing( else)?|stop|thank(s| you)|o ?(da|dá)a)\b/.test(t)) return {say:`Ó dáa. Your list is saved.`, end:true};
  if(/(what'?s|what is|read|tell me).*(list)|what do (we|i) need/.test(t)){
    const ex = extras(wk).filter(x=>!x.got).map(x=>x.name), pl = weekNeeds(wk).filter(i=>!(db.got[wk]||{})[i.g]).map(i=>i.g);
    const all = ex.concat(pl);
    if(!all.length) return {say:'The list is empty. What should I add?'};
    return {say:`You have ${all.length} things to buy. ${listText(all.slice(0,12))}${all.length>12?', and more':''}. Anything else?`};
  }
  if(/^(please\s+)?send\b|^(text|share)\b.*\blist\b/.test(t)) return {say:'Sending the shopping list to your phone.', end:true, action:'send'};
  if(/^clear\b.*(list|items|everything)/.test(t)){ db.extras[wk]=[]; save(); return {say:'I cleared the items you added. Anything else?'}; }
  let m;
  if((m = t.match(/^(?:remove|delete|take off|take away|cross off|scratch|we (?:already )?have|i (?:already )?have|got|bought)\s+(.+)/))){
    const done = [], missing = [];
    for(const n of splitItems(m[1])){
      const f = findItem(n);
      if(!f) missing.push(n);
      else if(f.type==='extra'){ const ex=extras(wk); ex.splice(ex.indexOf(f.x),1); done.push(f.x.name); }
      else { (db.got[wk] ||= {})[f.g]=true; done.push(f.g); }
    }
    save();
    return {say: (done.length?`Okay, ${listText(done)} crossed off. `:'') + (missing.length?`I couldn't find ${listText(missing)} on the list. `:'') + 'Anything else?'};
  }
  const body = t.replace(/^(?:please\s+)?(?:add|put|get|buy|we need|i need|we'?re out of|we are out of|we ran out of|out of)\s+/,'');
  const added = addItems(splitItems(body));
  return {say: added.length ? `Ó dáa! Added ${listText(added)}. Anything else?` : `That's already on the list. Anything else?`};
}
const voice = {
  active:false, rec:null, said:'', reply:'',
  paint(){
    const mic = $('#mic'); if(!mic) return;
    mic.classList.toggle('live', this.active); mic.textContent = this.active ? '■' : '🎤'; mic.disabled = !canVoice;
    if(this.reply) $('#vReply').textContent = this.reply;
    $('#vSaid').textContent = this.said ? `You said: “${this.said}”` : '';
  },
  speak(text, then){
    this.reply = text; this.paint();
    if(NATIVE){ window.__ttsDone = () => { window.__ttsDone = null; then && then(); }; NATIVE.speak(sayable(text)); return; }
    if(!window.speechSynthesis){ then && then(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sayable(text));
    u.lang = 'en-US'; u.rate = 1;
    u.onend = () => then && then();
    speechSynthesis.speak(u);
  },
  start(){
    if(!canVoice) return;
    this.active = true; this.said = ''; this.paint();
    this.speak(`Ẹ nlẹ́, ${db.names.wife}! What should I add to the shopping list?`, () => this.listen());
  },
  heard(final){
    if(!this.active) return;
    if(!final){ this.stop('I didn\'t hear anything, so I stopped listening. Tap the mic to try again.'); return; }
    const out = handleCommand(final);
    if(view==='shop') render();
    if(out.action==='send'){ this.active=false; this.paint(); this.reply=out.say; this.paint(); sendList().then(m=>{ this.speak(m); toast(m); }); return; }
    if(out.end){ this.active=false; this.speak(out.say); this.paint(); }
    else this.speak(out.say, () => this.listen());
  },
  listen(){
    if(!this.active) return;
    if(NATIVE){
      window.__sttPartial = t => { this.said = t; this.paint(); };
      window.__sttResult = t => { this.said = t; this.heard(t); };
      window.__sttError = e => { if(e==='not-allowed'){ this.active=false; this.speak('I need permission to use the microphone.'); } else this.heard(''); };
      NATIVE.listen(); return;
    }
    const r = this.rec = new SR();
    r.lang = 'en-NG'; r.interimResults = true; r.maxAlternatives = 1;
    let final = '';
    r.onresult = e => { const res = e.results[e.results.length-1]; this.said = res[0].transcript; if(res.isFinal) final = this.said; this.paint(); };
    r.onerror = e => { if(e.error==='not-allowed'){ this.active=false; this.speak('I need permission to use the microphone.'); } };
    r.onend = () => this.heard(final);
    r.start();
  },
  stop(msg){
    this.active = false;
    if(NATIVE) NATIVE.stopVoice(); else { try{ this.rec && this.rec.abort(); }catch(e){} }
    if(msg) this.speak(msg); else { if(!NATIVE && window.speechSynthesis) speechSynthesis.cancel(); this.paint(); }
  },
};

      <div class="row" style="margin-top:8px;font-size:15px"><span>≈ <b>${money(mealCost(m, db.home.kids+2))}</b> for the family</span>
        ${recipeOf(m)?`<a class="rlink" href="${recipeOf(m)}" target="_blank" rel="noopener">📖 Recipe</a>`:''}</div>
      ${m.custom?`<button class="btn warn" style="margin-top:10px;padding:8px 14px" data-del="${m.id}">Remove</button>`:''}</div>`).join('')}</div>
    <h2 style="margin-top:30px">Add a family meal</h2>

      <input type="text" id="nName" placeholder="Meal name, e.g. Abacha">

      <div class="chips" id="nCats">${['breakfast','lunchbox','lunch','dinner','late'].map(c=>`<button class="chip" data-c="${c}">${F[c]}</button>`).join('')}</div>

      <textarea id="nIng" rows="2" placeholder="Ingredients, separated by commas"></textarea>
      <input type="text" id="nTip" placeholder="Tip for ${esc(db.names.me)} (optional)">
      <div><button class="btn" id="nSave">Add meal</button></div>
    </div>`;
  $('#main').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{mealFilter=b.dataset.f; render();});
  $('#main').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ db.custom=db.custom.filter(m=>m.id!==b.dataset.del); save(); render(); });
  $('#main').querySelectorAll('#nCats .chip, #nD, #nK, #nP').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  $('#nSave').onclick=()=>{
    const name = $('#nName').value.trim(), cats=[...document.querySelectorAll('#nCats .chip.on')].map(b=>b.dataset.c);
    if(!name || !cats.length){ alert('Give the meal a name and pick at least one mealtime.'); return; }
    db.custom.push({id:'c'+Date.now(), custom:1, name, em:$('#nEm').value.trim()||'🍽️', cats,
      d:+$('#nD').classList.contains('on'), k:+$('#nK').classList.contains('on'), p:+$('#nP').classList.contains('on'),
      ing:$('#nIng').value.split(',').map(s=>s.trim()).filter(Boolean), tip:$('#nTip').value.trim()});

  };

/* ---------- Updates ---------- */
let swReg = null, appVersion = '', updating = false;
function showUpdate(worker){
  const b = $('#updateBar'); b.classList.add('on');
  $('#updateBtn').onclick = () => { updating = true; $('#updateBtn').textContent = 'Updating…'; worker.postMessage('skipWaiting'); };
}
function watchForUpdates(reg){
  swReg = reg;
  if(reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
  reg.addEventListener('updatefound', () => {
    const w = reg.installing;
    w.addEventListener('statechange', () => {
      if(w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
    });
  });
  setInterval(() => reg.update().catch(()=>{}), 30*60*1000); // fridge is always on: check every 30 min
}
async function checkForUpdates(){
  if(!swReg) return 'Updates work once the app is installed from its web address.';
  await swReg.update().catch(()=>{});
  return swReg.waiting || swReg.installing ? 'An update is downloading — look for the green bar.' : 'You have the latest version.';
}
if('serviceWorker' in navigator && location.protocol!=='file:'){
  // Reload only when the family tapped "Update now" (not when the app first installs itself)
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(updating){ updating = false; location.reload(); } });
  navigator.serviceWorker.addEventListener('message', e => { if(e.data?.version){ appVersion = e.data.version; if(view==='settings') render(); } });
  navigator.serviceWorker.register('sw.js').then(reg => {
    watchForUpdates(reg);
    navigator.serviceWorker.ready.then(r => r.active?.postMessage('version'));
  }).catch(()=>{});
}
